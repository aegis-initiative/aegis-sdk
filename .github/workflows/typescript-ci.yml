name: TypeScript CI
on:
  push:
    paths: ['packages/sdk-ts/**']
  pull_request:
    paths: ['packages/sdk-ts/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
