[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-initiative-sdk"
version = "0.1.1"
description = "Python client SDK for the AEGIS Governance Platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
  { name = "AEGIS Initiative", email = "engineering@aegis-initiative.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://aegis-initiative.com"
Repository = "https://github.com/aegis-initiative/aegis-sdk"
Documentation = "https://aegis-docs.com/sdk/python"

[tool.hatch.build.targets.wheel]
packages = ["aegis_sdk"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]